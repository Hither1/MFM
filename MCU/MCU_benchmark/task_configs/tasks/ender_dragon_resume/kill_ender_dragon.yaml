- /give @a minecraft:cooked_beef 16
defaults:
- base
- _self_
text: 'Defeat the Ender Dragon. The first part of the journey is already done: an earlier life of yours
  in this same world gathered wood, stone and iron, made the iron pickaxe, mined diamonds, made the
  diamond pickaxe and sword and a flint and steel, and mined 12 obsidian at a lava lake; milestones
  1-15 (through mine_obsidian and flint_and_steel) are credited to you. You stand at the spawn with
  the kit it held at that point -- the diamond pickaxe and sword, an iron and a stone pickaxe, the
  flint and steel, 12 obsidian, 2 diamonds, a bucket, a furnace, a crafting table, 128 cobblestone,
  12 torches, 6 coal, an iron ingot, a stick, 9 planks, 21 dirt, 39 gravel, 3 flint, 23 redstone and
  16 cooked beef. Those fifteen are counted with that life and nothing asks for them again: this life
  is for the nine after them. Continue from here: build and light the portal, the Nether, blaze rods and ender pearls,
  eyes of ender, a stronghold, and conquer The End.'
