# enderman_flat in DIAMOND armour (2026-10-06). The same level ground, mobs, night, sword,
# shield and kit; the four armour pieces are diamond instead of iron, and the text says so.
# Why: the task text credits "the diamond gear" of the journey so far, and a dragon run
# reaches this fight wearing it; the probe's iron set made the fight harder than the one
# it stands for. On hard an enderman hit took 6.4 of 20 through iron, three hits to the
# edge of death, while a kill needs six sword hits: six lives on enderman_flat landed
# 5, 1, 0, 0, 0 and 1 hits and no kill (jobs 50791171, 50828730).
custom_init_commands:
- /gamerule sendCommandFeedback false
- /gamerule announceAdvancements false
- /time set 18000
- /weather clear
- /give @s minecraft:diamond_sword 1
- /give @s minecraft:diamond_pickaxe 1
- /give @s minecraft:crafting_table 1
- /give @s minecraft:cobblestone 32
- /give @s minecraft:cooked_beef 16
- /give @s minecraft:blaze_powder 2
- /replaceitem entity @s weapon.offhand minecraft:shield
- /replaceitem entity @s armor.head minecraft:diamond_helmet
- /replaceitem entity @s armor.chest minecraft:diamond_chestplate
- /replaceitem entity @s armor.legs minecraft:diamond_leggings
- /replaceitem entity @s armor.feet minecraft:diamond_boots
- /fill ~-20 ~ ~-20 ~20 ~10 ~20 minecraft:air
- /fill ~-20 ~-16 ~-20 ~20 ~-1 ~20 minecraft:stone
- /summon minecraft:enderman ~6 ~1 ~
- /summon minecraft:enderman ~-5 ~1 ~5
- /summon minecraft:enderman ~ ~1 ~-7
defaults:
- base
- _self_
text: 'Kill an enderman, pick up its ender pearl and craft an eye of ender. The journey to this point is done and credited: an earlier expedition made the tools, the diamond gear, the portal, reached the Nether and brought back blaze powder. You stand in the Overworld at night, on ground cleared for this fight. You wear diamond armour and hold a shield in your off hand, and carry a diamond sword, a diamond pickaxe, a crafting table, 32 cobblestone, 16 cooked beef and 2 blaze powder. Three endermen stand within a few blocks of you; they attack whoever looks them in the eye. Kill one, pick up the pearl it drops, and craft an eye of ender from the pearl and a blaze powder.'

milestone_reward_cfg:
  - event: kill_entity
    identity: kill_enderman
    objects: [enderman]
    reward: 1.0
    max_reward_times: 1

  - event: pickup
    identity: ender_pearl
    objects: [ender_pearl]
    reward: 1.0
    max_reward_times: 1

  - event: craft_item
    identity: eye_of_ender
    objects: [ender_eye]
    reward: 1.0
    max_reward_times: 1

world_seed: 0
