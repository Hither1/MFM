# "Find the zombies' death spot" (MrSteve §4.3), reduced to what this harness can run.
#
# The three properties that make the paper's task strong, and how each is obtained here:
#
#   encoded with no task active   The agent's only goal at the start is `chop_wood`. The
#                                 landmark is simply there, burning, at the place it
#                                 happens to be standing. It has no reason to note it.
#   cannot be re-perceived        At step 600 the fire is extinguished and the netherrack
#                                 replaced with plain grass. Looking around cannot find a
#                                 thing that is no longer there, so re-exploration is not
#                                 a substitute for having remembered.
#   success is a PLACE            `event: reach`, scored on player position, not on any
#                                 statistic. See MilestoneLedger._reached.
#
# The landmark sits AT the spawn point rather than some distance away, which is the one
# real departure from the paper. MrSteve leads its agent past the zombies with a scripted
# exploration phase; this harness has no prologue driver -- the arm is in control from
# step 1 -- so a landmark 40 blocks away might never be seen at all, and the task would be
# measuring luck. Putting it underfoot guarantees the encoding happened and leaves the
# retrieval as the only variable.
#
# KNOWN, and worth reading the results with: this harness gives the agent `location_stats`
# every step, which MrSteve's pixel agents never had. So a sufficiently careful arm can
# solve this by writing down a coordinate rather than by recognising a place. That is
# still the memory question for these agents -- did you record the thing that turned out
# to matter? -- but it is a different question from the paper's, and a run where every arm
# succeeds by dead reckoning has measured note-taking, not recall.
#
# STEP SCALES ARE CALIBRATED TO THIS HARNESS, NOT TO THE PAPER. MrSteve's numbers assume
# one reactive policy at one cadence; measured here (2026-09-07) the arms differ by 500x
# in model turns per environment step -- mfm 1.4 per 1,000 steps, arc 2.7, vista 17.5,
# plmfm 711. A prologue sized in steps therefore buys wildly different amounts of
# *encoding*: at the paper's scale mfm saw this landmark for less than one model turn
# before it was removed, which is not incidental encoding, it is not seeing it.
#
# So these are sized in mfm turns (~714 steps each, the slowest turn rate of the band
# this task is for) and the task is meant for the mfm/arc/vista band only.
#
# THE PRO-LONG BAND CANNOT RUN THIS. Measured on abaw3_plmfm 2026-09-08: 779 steps in
# 4 h 27 m = 175 steps/hour, one model turn every 2.5 steps. This task's gate at step
# 7,200 therefore needs 41 h of walltime, which is reachable inside the 60 h
# arm.sbatch allows (and no partition here offers more than 72 h). Rescaling the gates
# to fit PRO-LONG is not an option either: the scales exist so mfm gets ~10 model turns
# of exposure per landmark, and dividing them down would leave mfm 1-2 turns, which is
# not incidental encoding, it is not seeing it. No single step scale serves both bands;
# the empty PRO-LONG cell is the finding, not a gap to be papered over.
#
# The ceiling is RAM, not wall clock: the green agent's RecordCallback holds every frame
# (691 KB at 640x360) and only writes at close, so a 20,000-step episode carries ~14 GB
# against the job's 48 GB. That, not time, is what caps the prologue.

custom_init_commands:
# The landmark, underfoot at spawn: a burning netherrack pillar, visible from a distance
# and unmistakable up close.
- /fill ~-1 ~-1 ~-1 ~1 ~-1 ~1 minecraft:netherrack
- /setblock ~ ~ ~1 minecraft:fire
- /setblock ~1 ~ ~ minecraft:fire
- /setblock ~-1 ~ ~ minecraft:fire
- /setblock ~ ~ ~-1 minecraft:fire
- /give @s minecraft:diamond_axe 1

# The fire goes out and the ground is ordinary grass again. 7,000 steps is ~10 mfm
# turns of exposure; MrSteve's ~500 was ~10 turns for a 20 FPS reactive policy.
scheduled_commands:
- step: 7000
  commands:
  # Absolute, via the {x}/{y}/{z} the callback fills in with the episode's start
  # position. `~` would resolve against wherever the agent is standing at step 600 --
  # off chopping wood -- and would leave the fire burning where it actually is.
  - /fill {x-4} {y} {z-4} {x+4} {y+2} {z+4} minecraft:air replace minecraft:fire
  - /fill {x-1} {y-1} {z-1} {x+1} {y-1} {z+1} minecraft:grass_block

defaults:
- base
- _self_
text: You are given one goal at a time. The next goal appears only once the current one has been verified by the environment. Anything you do towards a goal that has not appeared yet counts for nothing.
milestone_reveal: sequential
world_seed: 42
spawn_biome: plains
milestone_reward_cfg:
# Goal 1: an ordinary errand that takes the agent away from the start.
- event: mine_block
  identity: chop_wood
  objects: [log, oak_log, birch_log, spruce_log]
  reward: 1.0
  max_reward_times: 1
# Goal 2: revealed only now, and by then the landmark is gone.
- event: reach
  identity: return_to_fire
  # Required, and deliberately empty: the green agent's RewardsCallback indexes `objects`
  # on every rule, so omitting it is a KeyError mid-run; empty means it never scores this
  # rule, which is correct -- position is the agent-side ledger's to verify.
  objects: []
  # Relative to where the episode began, which is where the fire was.
  target: [0, 0]
  radius: 6
  # How the goal is named in the prompt. Without it the checklist would render the
  # target's coordinates, which is the answer -- see MilestoneLedger.describe_target.
  describe: the place where the fire was burning when this episode began
  after: [chop_wood]
  # Time as well as order. `after` alone would let an agent that chopped wood at step 300
  # satisfy this while the fire is still burning ten steps away -- which is a walk, not a
  # recall. This opens only once the landmark is gone.
  not_before: 7200
  reward: 1.0
  max_reward_times: 1
