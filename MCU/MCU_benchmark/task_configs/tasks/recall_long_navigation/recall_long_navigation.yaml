# Long-Navigation (MrSteve §4.4 / C.2.5), adapted to what this harness can measure.
#
# The paper: a 16K-step exploration phase with NO task at all, six landmarks at 2K steps
# each, three of them transient (burning zombies, sugarcane blowing up, a spider spawn),
# then an image goal naming one of them. What makes it the strongest incidental-encoding
# probe in the paper is that during the exploration phase there is nothing to be relevant
# *to*, and that the transient landmarks cannot be re-perceived afterwards.
#
# Both properties are kept here:
#
#   no task during exploration   `not_before: 21500` on the only goal. The agent spends
#                                the whole prologue with an empty checklist -- not a
#                                hidden goal, no goal. `after:` cannot express this;
#                                there is no earlier goal to hang it on.
#   the target is gone           The fire pit is extinguished and levelled at step 4100,
#                                right after the agent is moved on from it, so by the time
#                                it is asked, looking around cannot find it.
#
# TWO DELIBERATE DEPARTURES, both so the arms stay comparable:
#
#   * A text designator, not an image goal. These arms are prompted with text plus the
#     current frame; attaching a second, goal image changes the prompt contract for every
#     one of them and lands differently in the arc / vista / logbook paths, which would
#     put a new confound inside the very comparison this task exists to make.
#   * Six landmarks in a ring ~70 blocks out rather than a 200x200 map. The paper's map
#     is sized for a policy that walks; this prologue teleports, so the distances only
#     need to be far enough apart that the goal's radius cannot be satisfied by accident.
#
# STEP SCALES ARE CALIBRATED TO THIS HARNESS, NOT TO THE PAPER. MrSteve's numbers assume
# one reactive policy at one cadence; measured here (2026-09-07) the arms differ by 500x
# in model turns per environment step -- mfm 1.4 per 1,000 steps, arc 2.7, vista 17.5,
# plmfm 711. A prologue sized in steps therefore buys wildly different amounts of
# *encoding*: at the paper's scale mfm saw this landmark for less than one model turn
# before it was removed, which is not incidental encoding, it is not seeing it.
#
# So these are sized in mfm turns (~714 steps each, the slowest turn rate of the band
# this task is for) and the task is meant for the mfm/arc/vista band only.
#
# THE PRO-LONG BAND CANNOT RUN THIS. Measured on abaw3_plmfm 2026-09-08: 779 steps in
# 4 h 27 m = 175 steps/hour, one model turn every 2.5 steps. This task's gate at step
# 21,500 therefore needs 123 h of walltime, which is NOT reachable inside the 60 h
# arm.sbatch allows (and no partition here offers more than 72 h). Rescaling the gates
# to fit PRO-LONG is not an option either: the scales exist so mfm gets ~10 model turns
# of exposure per landmark, and dividing them down would leave mfm 1-2 turns, which is
# not incidental encoding, it is not seeing it. No single step scale serves both bands;
# the empty PRO-LONG cell is the finding, not a gap to be papered over.
#
# The ceiling is RAM, not wall clock: the green agent's RecordCallback holds every frame
# (691 KB at 640x360) and only writes at close, so a 20,000-step episode carries ~14 GB
# against the job's 48 GB. That, not time, is what caps the prologue.

custom_init_commands:
# 1. the fire pit -- TRANSIENT, and the one the goal asks for.
- /fill ~68 ~-1 ~-2 ~72 ~-1 ~2 minecraft:netherrack
- /setblock ~70 ~ ~ minecraft:fire
- /setblock ~69 ~ ~1 minecraft:fire
# 2. a pond
- /fill ~-2 ~-1 ~68 ~2 ~-1 ~72 minecraft:water
# 3. a tower
- /fill ~-72 ~-1 ~-2 ~-68 ~-1 ~2 minecraft:stone
- /fill ~-70 ~ ~ ~-70 ~8 ~ minecraft:cobblestone
# 4. a pumpkin patch -- TRANSIENT
- /fill ~-2 ~-1 ~-72 ~2 ~-1 ~-68 minecraft:pumpkin
# 5. a hut
- /fill ~48 ~ ~48 ~52 ~3 ~52 minecraft:oak_planks hollow
# 6. a gold block marker -- TRANSIENT
- /fill ~-52 ~-1 ~48 ~-48 ~-1 ~52 minecraft:gold_block
- /give @s minecraft:diamond_axe 1

scheduled_commands:
# The prologue: ~2,000 steps at each of six landmarks, as in the paper. Teleports rather
# than a walked route -- see recall_first_house for why.
- step: 100
  commands: ["/tp @s {x+70} {y+1} {z}"]                 # 1. fire pit
- step: 3600
  commands: ["/tp @s {x} {y+1} {z+70}"]                 # 2. pond
# The fire pit stops existing the moment the agent has left it. Absolute coordinates via
# the {x}/{y}/{z} placeholders: `~` would resolve against the agent's position at step
# 4100 -- standing at the pond -- and would erase the wrong place entirely.
- step: 3700
  commands:
  - /fill {x+66} {y} {z-4} {x+74} {y+2} {z+4} minecraft:air replace minecraft:fire
  - /fill {x+68} {y-1} {z-2} {x+72} {y-1} {z+2} minecraft:grass_block
- step: 7100
  commands: ["/tp @s {x-70} {y+1} {z}"]                 # 3. tower
- step: 10600
  commands: ["/tp @s {x} {y+1} {z-70}"]                 # 4. pumpkin patch
- step: 14100
  commands:
  - /fill {x-2} {y-1} {z-72} {x+2} {y-1} {z-68} minecraft:grass_block   # patch gone
  - /tp @s {x+50} {y+1} {z+50}                                          # 5. hut
- step: 17600
  commands: ["/tp @s {x-50} {y+1} {z+50}"]              # 6. gold marker
- step: 21100
  commands:
  - /fill {x-52} {y-1} {z+48} {x-48} {y-1} {z+52} minecraft:grass_block  # marker gone
  # Back to the middle. The recall journey starts from the start, not from landmark six.
  - /tp @s {x} {y+1} {z}

defaults:
- base
- _self_
text: You are given one goal at a time. The next goal appears only once the current one has been verified by the environment. Anything you do towards a goal that has not appeared yet counts for nothing.
milestone_reveal: sequential
world_seed: 42
spawn_biome: plains
milestone_reward_cfg:
- event: reach
  identity: return_to_fire_pit
  objects: []
  # Landmark 1, relative to the episode start.
  target: [70, 0]
  radius: 10
  # Nothing at all is asked until the prologue has finished and the agent is back in the
  # middle. 21,500 = the last teleport at 21,100 plus a margin.
  not_before: 21500
  describe: the place where you saw a patch of ground burning, early on
  reward: 1.0
  max_reward_times: 1
