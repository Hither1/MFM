# Instrument, not a probe (slurm/skill_reuse3.sbatch SMOKE=stare_eyes | stare_body): does
# an enderman in THIS engine teleport away when it is looked in the eye at close range?
# Six probe lives closed on an enderman, aimed at its eyes and lost it at contact (0
# kills, at most 2 hits of the 6 a kill needs). The game's rule, as read from its source:
# an enderman whose target stares at it from under 4 blocks teleports at random; a melee
# hit from a player does not move it.
# One enderman is summoned two blocks east inside a ring of fences (the kill_check pen: it
# cannot walk out), on ground cleared of trees; the avatar has Resistance V, so nothing
# can kill it. No detector and no walking: the scripted loop holds one fixed aim and taps
# attack on the sword's cooldown. stare_eyes aims at the eyes (pitch -25 at 2 blocks),
# stare_body at the middle of the body (pitch +5, 30 degrees off the eyes).
# (A first version let the enderman roam and found it by its eyes: sighted in 12 of 330
# calls, never in reach in either mode -- jobs 50712121/2, nothing learned.)
custom_init_commands:
- /time set 18000
- /weather clear
- /give @s minecraft:diamond_sword 1
- /effect give @s minecraft:resistance 99999 4 true
- /fill ~-12 ~ ~-12 ~12 ~8 ~12 minecraft:air
- /fill ~1 ~ ~-1 ~3 ~ ~1 minecraft:oak_fence hollow
- /summon minecraft:enderman ~2 ~1 ~
defaults:
- base
- _self_
text: 'An instrument run: one enderman stands in a fence ring two blocks east of you at night. Kill it with the diamond sword you hold.'

milestone_reward_cfg:
  - event: kill_entity
    identity: kill_enderman
    objects: [enderman]
    reward: 1.0
    max_reward_times: 1

world_seed: 0
