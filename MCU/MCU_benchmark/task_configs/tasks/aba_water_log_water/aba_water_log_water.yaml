# Ported from MrSteve (frechele/MrSteve, ICLR 2025), mrsteve/env/minedojo/task/
# minedojo/task_specs.yaml: `log_water_bucket_aba_randinit`.
#
# A-B-A. The first and third goals are the same statistic, so the ordering constraint is
# the task -- see `after:` below and `MilestoneLedger.eligible`. MrSteve enforced it by
# clearing the inventory between subtasks because it scored inventory *contents*; this
# harness scores event *deltas*, so a goal that is not yet live simply banks nothing and
# the return trip is required by construction. No inventory reset is needed.
#
# `milestone_reveal: sequential` is load-bearing. The prompt normally carries the whole
# ordered checklist, which would tell the agent at step 0 that it must come back here --
# and an agent that knows it will need the pond again will deliberately memorise it.
# Deliberate encoding is the opposite of what this task measures.
#
# The water goal scores `use_item` of `bucket` -- filling one. Emptying it again is
# `use_item` of `water_bucket`, a different item, so the two do not collide: the second
# fill genuinely requires being at water a second time. Only one bucket is given, so the
# agent must empty it before it can fill it again.
#
# World pinning, as MrSteve does (`specified_biome: plains`, `world_seed = 42 +
# episode_id`). Plains rather than the harness default of whatever seed 0 spawns into:
# forest would make the log leg trivial everywhere, and log scarcity is the variable the
# inverted variants turn on. `world_seed` is the episode-0 world; a campaign sweeps it
# with MCU_WORLD_SEED (one episode per process here), which is what gives 100 samples
# rather than one world measured 100 times.

custom_init_commands:
- /give @s minecraft:bucket 1
defaults:
- base
- _self_
text: You are given one goal at a time. The next goal appears only once the current one has been verified by the environment. Anything you do towards a goal that has not appeared yet counts for nothing.
milestone_reveal: sequential
world_seed: 42
spawn_biome: plains
milestone_reward_cfg:
- event: use_item
  identity: water_1
  objects: [bucket]
  reward: 1.0
  max_reward_times: 1
- event: mine_block
  identity: log_1
  objects: [log, oak_log, birch_log, spruce_log]
  after: [water_1]
  reward: 1.0
  max_reward_times: 1
- event: use_item
  identity: water_2
  objects: [bucket]
  after: [log_1]
  reward: 1.0
  max_reward_times: 1
