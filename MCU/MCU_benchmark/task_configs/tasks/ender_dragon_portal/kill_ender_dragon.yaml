custom_init_commands:
- /give @a minecraft:iron_pickaxe 1
- /give @a minecraft:stone_pickaxe 1
- /give @a minecraft:crafting_table 1
- /give @a minecraft:furnace 1
- /give @a minecraft:cobblestone 64
- /give @a minecraft:torch 8
- /give @a minecraft:coal 6
- /give @a minecraft:stick 4
- /give @a minecraft:spruce_planks 8
- /give @a minecraft:dirt 16
- /give @a minecraft:iron_ingot 4
- /give @a minecraft:obsidian 14
- /give @a minecraft:flint_and_steel 1
- /execute at @a run summon minecraft:item ~ ~1 ~ {PickupDelay:8s,Item:{id:"minecraft:diamond",Count:5b}}
defaults:
- base
- _self_
text: 'Defeat the Ender Dragon. The first part of the journey is already done: a previous expedition gathered
  wood, stone and iron, made an iron pickaxe, mined diamond ore, mined obsidian and made a flint and steel,
  and milestones 1-10 plus mine_obsidian and flint_and_steel are credited to you. You carry its kit --
  an iron and a stone pickaxe, a crafting table, a furnace, 64 cobblestone, 8 torches, 6 coal, 4 sticks,
  8 planks, 16 dirt, 4 iron ingots, 14 obsidian and a flint and steel -- and its 5 diamonds lie at your
  feet. Continue from here: pick up the diamonds, diamond gear, build and light the portal, the Nether,
  blaze rods and ender pearls, eyes of ender, a stronghold, and conquer The End.'
