# Skill-reuse probe, second design (see iron_shield_tail): the iron tail ending in
# shears, which take two ingots.
custom_init_commands:
- /give @s minecraft:stone_pickaxe 1
- /give @s minecraft:crafting_table 1
- /give @s minecraft:cobblestone 8
- /give @s minecraft:oak_log 6
defaults:
- base
- _self_
text: Craft shears. You start with a stone pickaxe, a crafting table, 8 cobblestone and 6 oak logs in your inventory; build a furnace, mine iron ore, smelt two iron ingots and craft the shears.

milestone_reward_cfg:
  - event: craft_item
    identity: furnace
    objects: [furnace]
    reward: 1.0
    max_reward_times: 1

  - event: mine_block
    identity: mine_iron_ore
    objects: [iron_ore]
    reward: 1.0
    max_reward_times: 1

  - event: craft_item
    identity: iron_ingot
    objects: [iron_ingot]
    reward: 1.0
    max_reward_times: 1

  - event: craft_item
    identity: shears
    objects: [shears]
    reward: 1.0
    max_reward_times: 1

# A world no diamond or dragon life has played (theirs is 0).
world_seed: 1
