# The dragon task continued PAST the search (2026-10-06): the lives of this chain reached
# the Nether (milestone 16) and died within 70 blocks of the spawn-linked portal, 488
# blocks from the nearest fortress, so nothing after netherrack was ever attempted in the
# full task. Here the avatar is put on a brick bridge of that fortress, 19 blocks east of
# a blaze spawner (a spawner is quiet until a player is within 16), with the kit the chain
# held at its obsidian and what the blaze probe handed over for the fight (blaze_tail: a
# shield in the off hand, iron armour worn, food). The fortress, the bridge cell and the
# spawner were read from the engine (`/locate`, scripts/fortress_map.py). The 24 rules are
# ender_dragon's; the sixteen through netherrack are the earlier lives', settled. The respawn
# point is set on the bridge (2026-10-06): the first life here killed a blaze at step 2,293,
# died at 4,254, respawned at the Overworld spawn and spent its other 25,700 steps there.
custom_init_commands:
- /give @a minecraft:diamond_pickaxe 1
- /give @a minecraft:diamond_sword 1
- /give @a minecraft:iron_pickaxe 1
- /give @a minecraft:flint_and_steel 1
- /give @a minecraft:obsidian 12
- /give @a minecraft:crafting_table 1
- /give @a minecraft:cobblestone 64
- /give @a minecraft:cobblestone 64
- /give @a minecraft:cooked_beef 16
- /give @a minecraft:torch 12
- /give @a minecraft:diamond 2
- /give @a minecraft:bucket 1
- /give @a minecraft:furnace 1
- /give @a minecraft:coal 6
- /give @a minecraft:stick 1
- /give @a minecraft:spruce_planks 9
- /replaceitem entity @s weapon.offhand minecraft:shield
- /replaceitem entity @s armor.head minecraft:iron_helmet
- /replaceitem entity @s armor.chest minecraft:iron_chestplate
- /replaceitem entity @s armor.legs minecraft:iron_leggings
- /replaceitem entity @s armor.feet minecraft:iron_boots
- /execute in minecraft:the_nether run forceload add -624 -240 -600 -212
- /execute in minecraft:the_nether run tp @s -612.5 67 -225.5
- /execute in minecraft:the_nether run spawnpoint @s -612 67 -226
- /execute in minecraft:the_nether run forceload remove -624 -240 -600 -212
defaults:
- base
- _self_
text: 'Defeat the Ender Dragon. The first part of the journey is already done: earlier lives of yours
  in this same world went from wood to the diamond pickaxe and sword, mined obsidian, lit a portal and
  reached the Nether; milestones 1-16 (through netherrack) are counted with those lives and nothing
  asks for them again: this life is for the eight after them. You have been put past the search they
  never finished: you stand in the Nether on a brick bridge of a nether fortress, at (-612, 67, -225),
  and a blaze spawner stands on a platform about 19 blocks west of you, at (-631, 70, -226). You carry
  the diamond pickaxe and sword, an iron pickaxe, a flint and steel, 12 obsidian, a crafting table, 128
  cobblestone, 16 cooked beef, 12 torches, 2 diamonds, a bucket, a furnace, 6 coal, a stick and 9
  planks, a shield in your off hand, and you wear iron armour. There is no portal here: the one your
  earlier lives used is 488 blocks away at (-374, 50, -685). Your respawn point is set on this bridge:
  if you die you come back here, and what you carried and wore lies where you died. Continue from here: blaze rods, ender pearls, blaze powder, eyes of ender, a stronghold,
  and conquer The End.'
