# Skill-reuse probe 3 of 3 (see cook_meat): the diamond task's own chain through the
# first iron ingot, in another world, ending in an item no diamond life made. The
# nearest of the three to the task the carried memory comes from.
custom_init_commands: []
defaults:
- base
- _self_
text: Starting with nothing, craft a shield by gathering wood, crafting tools, mining iron ore and smelting it.

milestone_reward_cfg:
  - event: mine_block
    identity: mine_log
    objects: [log, oak_log, birch_log, spruce_log]
    reward: 1.0
    max_reward_times: 1

  - event: craft_item
    identity: crafting_table
    objects: [crafting_table]
    reward: 1.0
    max_reward_times: 1

  - event: craft_item
    identity: wooden_pickaxe
    objects: [wooden_pickaxe]
    reward: 1.0
    max_reward_times: 1

  - event: pickup
    identity: cobblestone
    objects: [cobblestone]
    reward: 1.0
    max_reward_times: 1

  - event: craft_item
    identity: stone_pickaxe
    objects: [stone_pickaxe]
    reward: 1.0
    max_reward_times: 1

  - event: craft_item
    identity: furnace
    objects: [furnace]
    reward: 1.0
    max_reward_times: 1

  - event: mine_block
    identity: mine_iron_ore
    objects: [iron_ore]
    reward: 1.0
    max_reward_times: 1

  - event: craft_item
    identity: iron_ingot
    objects: [iron_ingot]
    reward: 1.0
    max_reward_times: 1

  - event: craft_item
    identity: shield
    objects: [shield]
    reward: 1.0
    max_reward_times: 1

# A world no diamond or dragon life has played (theirs is 0).
world_seed: 1
