# "Find the first-visited house" (MrSteve §4.3): the *when* task.
#
# Two houses, built identically, 70 blocks apart. The agent is taken to house A briefly,
# then to house B for much longer, then away. Later it is asked to go back to the FIRST
# one it saw. Both are still standing and they look the same, so nothing about the places
# themselves distinguishes them -- only the order in which they were seen does. That is
# the dimension a memory indexed purely by place or purely by event cannot answer.
#
# The prologue is teleports, not a scripted walking route. MrSteve leads its agent with a
# scripted exploration phase; this harness has no driver for that, and does not need one
# -- `ScheduledCommandsCallback` moves the agent between waypoints while the arm keeps
# running its normal loop, observing and writing memory as it goes. Deterministic, and
# identical for every arm, which a walked route over real terrain would not be.
#
# No visit-order tracking is needed in the ledger: the order is imposed here, so "the
# first house" is house A by construction.
#
# STEP SCALES ARE CALIBRATED TO THIS HARNESS, NOT TO THE PAPER. MrSteve's numbers assume
# one reactive policy at one cadence; measured here (2026-09-07) the arms differ by 500x
# in model turns per environment step -- mfm 1.4 per 1,000 steps, arc 2.7, vista 17.5,
# plmfm 711. A prologue sized in steps therefore buys wildly different amounts of
# *encoding*: at the paper's scale mfm saw this landmark for less than one model turn
# before it was removed, which is not incidental encoding, it is not seeing it.
#
# So these are sized in mfm turns (~714 steps each, the slowest turn rate of the band
# this task is for) and the task is meant for the mfm/arc/vista band only.
#
# THE PRO-LONG BAND CANNOT RUN THIS. Measured on abaw3_plmfm 2026-09-08: 779 steps in
# 4 h 27 m = 175 steps/hour, one model turn every 2.5 steps. This task's gate at step
# 13,600 therefore needs 78 h of walltime, which is NOT reachable inside the 60 h
# arm.sbatch allows (and no partition here offers more than 72 h). Rescaling the gates
# to fit PRO-LONG is not an option either: the scales exist so mfm gets ~10 model turns
# of exposure per landmark, and dividing them down would leave mfm 1-2 turns, which is
# not incidental encoding, it is not seeing it. No single step scale serves both bands;
# the empty PRO-LONG cell is the finding, not a gap to be papered over.
#
# The ceiling is RAM, not wall clock: the green agent's RecordCallback holds every frame
# (691 KB at 640x360) and only writes at close, so a 20,000-step episode carries ~14 GB
# against the job's 48 GB. That, not time, is what caps the prologue.

custom_init_commands:
# Two identical 5x5 huts. Built from the same block palette on purpose: if they differed
# the agent could tell them apart by looking, and the task would not be about time.
- /fill ~48 ~-1 ~-2 ~52 ~-1 ~2 minecraft:oak_planks
- /fill ~48 ~ ~-2 ~52 ~3 ~2 minecraft:cobblestone hollow
- /setblock ~48 ~1 ~ minecraft:torch
- /fill ~-2 ~-1 ~48 ~2 ~-1 ~52 minecraft:oak_planks
- /fill ~-2 ~ ~48 ~2 ~3 ~52 minecraft:cobblestone hollow
- /setblock ~ ~1 ~48 minecraft:torch
- /give @s minecraft:diamond_axe 1

scheduled_commands:
# House A: ~2,100 steps = ~3 mfm turns. The paper's 100:2000 ratio would need B at
# 42,000 steps and a 29 GB frame buffer; 1:5 is used instead, which keeps the first
# house much the briefer of the two -- the property the task turns on.
- step: 700
  commands: ["/tp @s {x+50} {y+1} {z}"]
# House B: ~10,500 steps = ~15 mfm turns.
- step: 2800
  commands: ["/tp @s {x} {y+1} {z+50}"]
# Away from both, so the recall goal is a real journey rather than "stay put".
- step: 13300
  commands: ["/tp @s {x-60} {y+1} {z-60}"]

defaults:
- base
- _self_
text: You are given one goal at a time. The next goal appears only once the current one has been verified by the environment. Anything you do towards a goal that has not appeared yet counts for nothing.
milestone_reveal: sequential
world_seed: 42
spawn_biome: plains
milestone_reward_cfg:
- event: reach
  identity: return_to_first_house
  # Required by the green agent's RewardsCallback, which indexes `objects` on every rule;
  # empty so it never scores a rule it cannot evaluate.
  objects: []
  # House A. Relative to the episode start, like every offset in this file.
  target: [50, 0]
  # Comfortably smaller than the 70-block separation, so standing at house B can never
  # be credited as house A.
  radius: 10
  # Nothing is asked of the agent until the prologue is over: 2,400 steps of being moved
  # between two houses with no goal at all, which is what makes the encoding incidental.
  not_before: 13600
  describe: the FIRST of the two huts you were taken to, not the second
  reward: 1.0
  max_reward_times: 1
