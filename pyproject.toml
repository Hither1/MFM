[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mfm"
version = "0.1.0"
description = "Multimodal Filesystem Memory: the shared backend, agent base and memory for the MCU and KiCad benchmarks"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["mfm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
