[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mfm"
version = "0.1.0"
description = "Multimodal Filesystem Memory: the episode memory both harnesses use, and the agent base and Codex backend of the KiCad harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# The package runs inside each benchmark's own environment (MCU/.venv, the cua-lite
# venv), which already has Pillow; the scripts put the repository root on PYTHONPATH.
dependencies = ["Pillow"]

[tool.setuptools.packages.find]
include = ["mfm*"]
